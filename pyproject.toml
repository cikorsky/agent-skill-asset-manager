[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "asam"
version = "1.0.0"
description = "Agent Skill Asset Manager — scan, index, search, and maintain AI agent skill libraries"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "ASAM Contributors"},
]
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0",
]
[project.optional-dependencies]
excel = ["pandas>=2.0", "openpyxl>=3.0"]
search = ["pandas>=2.0", "openpyxl>=3.0"]
all = ["pandas>=2.0", "openpyxl>=3.0", "pyyaml>=6.0"]

[project.urls]
homepage = "https://github.com/cikorsky/agent-skill-asset-manager"
repository = "https://github.com/cikorsky/agent-skill-asset-manager"

[project.scripts]
asam-scan = "asam.cli:scan_main"
asam-sync = "asam.cli:sync_main"
asam-search = "asam.cli:search_main"
asam-update = "asam.cli:update_main"

[tool.setuptools.packages.find]
where = ["src"]
